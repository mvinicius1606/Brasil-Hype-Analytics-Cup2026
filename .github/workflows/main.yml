name: BrasilHype World Cup Daily Pipeline

on:
  schedule:
    # Executo o pipeline todos os dias às 03:00 UTC (Meia-noite no Horário de Brasília)
    # Isso garante a captura completa das 24 horas do dia anterior (D-1)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Permito o disparo manual do fluxo a qualquer momento pelo painel do GitHub Actions

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: 🛠️ Passo 1 - Checkout do Repositório
      uses: actions/checkout@v3

    - name: 🔑 Passo 2 - Configurar Credenciais AWS
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

    - name: 🐳 Passo 3 - Construir a Imagem Docker do Pipeline
      run: docker build -t brasilhype-pipeline:latest .

    - name: 🚀 Passo 4 - Executar Contêiner e Injetar Segredos
      run: |
        docker run --rm \
          -e BLUESKY_HANDLE=${{ secrets.BLUESKY_HANDLE }} \
          -e BLUESKY_PASSWORD=${{ secrets.BLUESKY_PASSWORD }} \
          -e AWS_S3_BUCKET_NAME=${{ secrets.AWS_S3_BUCKET_NAME }} \
          -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
          -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
          -e AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION }} \
          brasilhype-pipeline:latest